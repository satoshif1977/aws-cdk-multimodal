name: Python Test

on:
  push:
    paths:
      - "lambda_src/process_doc/**"
      - ".github/workflows/python-test.yml"
  pull_request:
    paths:
      - "lambda_src/process_doc/**"
      - ".github/workflows/python-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda_src/process_doc

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest boto3

      - name: Run pytest
        run: pytest test_lambda_function.py -v
