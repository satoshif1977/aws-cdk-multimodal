name: Python Test

on:
  push:
    paths:
      - "lambda_src/process_doc/**"
      - ".github/workflows/python-test.yml"
  pull_request:
    paths:
      - "lambda_src/process_doc/**"
      - ".github/workflows/python-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda_src/process_doc

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pytest-cov boto3

      - name: Run pytest
        run: pytest test_lambda_function.py test_lambda_function_detail.py -v --cov=. --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python
          fail_ci_if_error: false
